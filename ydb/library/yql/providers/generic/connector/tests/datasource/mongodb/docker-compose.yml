services:
  fq-connector-go:
    container_name: fq-tests-mongodb-fq-connector-go
    image: ghcr.io/ydb-platform/fq-connector-go:v0.7.0@sha256:1fedb688bc9bca700064cc7e3a3c29e8b3f9d4a5be8ca79432356dbe17e4ddda
    ports:
      - 2130
    volumes:
      - ../../fq-connector-go/:/opt/ydb/cfg/
  mongodb:
    container_name: fq-tests-mongodb-mongodb
    environment:
      MONGO_INITDB_DATABASE: mongodb_integration_test
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    image: mongo:7.0.0@sha256:3df5f8face3becc953225f3b449269b7aadc9cdea865047d75eef0ec34c119ed
    ports:
      - 27017:27017
    tmpfs:
      - /run
      - /tmp
      - /var
    volumes:
      - ./init:/docker-entrypoint-initdb.d
version: "3.4"
